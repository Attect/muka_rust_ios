[workspace]
members = [
    "crates/rust-ios-protocol",
    "crates/rust-ios-core",
    "crates/rust-ios-server",
    "crates/rust-ios-cli",
]
default-members = ["crates/rust-ios-cli"]
exclude = ["vendor/idevice-0.1.65", "vendor/ios-core-0.1.7"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = ["Attect"]
repository = "https://github.com/Attect/muka_rust_ios"

[workspace.dependencies]
anyhow = "1.0.100"
apple-codesign = { version = "0.29.0", default-features = false }
async-trait = "0.1.89"
axum = { version = "0.8.8", features = ["ws"] }
base64 = "0.22.1"
bytes = "1.11.0"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.5.54", features = ["derive", "env", "string"] }
cryptographic-message-syntax = { version = "=0.27.0", default-features = false }
directories = "6.0.0"
fs2 = "0.4.3"
futures-util = "0.3.31"
glob = "0.3.3"
hex = "0.4.3"
idevice = { version = "=0.1.65", default-features = false, features = ["full", "ring"] }
mdns-sd = "=0.20.1"
ns-keyed-archive = "0.1.5"
ios-device-core = { package = "ios-core", version = "=0.1.7", default-features = false, features = ["accessibility_audit", "deviceinfo", "fileservice", "webinspector"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
plist = "1.8.0"
quick-xml = { version = "0.38.4", features = ["serialize"] }
p12-keystore = "0.1.5"
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "pem", "std"] }
percent-encoding = "2.3.2"
rand = "0.9.2"
rand_08 = { package = "rand", version = "0.8.5" }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
rsa = { version = "0.9.10", features = ["sha1", "sha2", "pem"] }
rustls = { version = "0.23.36", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha1 = "0.10.6"
sha2 = "0.10.9"
thiserror = "2.0.17"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["full"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
tokio-tungstenite = "0.29.0"
tokio-util = { version = "0.7.17", features = ["rt"] }
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
tun-rs = { version = "2.8.7", default-features = false, features = ["async_tokio"] }
uuid = { version = "1.19.0", features = ["v4", "serde"] }
x509-certificate = "=0.24.0"
zip = { version = "2.2.1", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# apple-codesign 会让 Windows test harness 的完整 PDB 超过 MSVC 限额；保留行号即可。
[profile.test]
debug = 1

[patch.crates-io]
idevice = { path = "vendor/idevice-0.1.65" }
ios-core = { path = "vendor/ios-core-0.1.7" }



